name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # The job name is the required status-check context the
    # .factory-kit.yml manifest and branch protection reference.
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The kit is stdlib-only: nothing to install.
      - name: Run the unittest suite
        run: python -m unittest discover -s tests
